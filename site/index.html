<style>
/* Layout: app shell. Feed (or hospital ledger) on the left, the map framed like a chart plate on the right.
   Details slide over the feed column on desktop and rise as bottom sheets on phones.
   Palette: cool chart-paper neutrals, harbor teal for action, nautical chart magenta ("beacon") only for New and hotspots. */
:root{
  --bg:#EDF1F0; --surface:#FBFCFC; --surface-2:#E3EAE9; --ink:#132327; --ink-2:#48595D; --ink-3:#5E7073;
  --rule:#D3DCDB; --rule-strong:#AFBDBD;
  --accent:#1B5C64; --accent-hover:#144A51; --accent-soft:#D4E5E3; --on-accent:#FFFFFF; --halo:rgba(27,92,100,.22);
  --beacon:#A3336B; --beacon-soft:#F3DFE9; --on-beacon:#FFFFFF;
  --star:#B7791F; --warn:#8A5F12;
  --sea:#D5E3E7; --land:#EEEEE8; --land-line:#B3C2C3;
  --shadow-c:rgba(19,35,39,.18); --shadow:0 1px 2px rgba(19,35,39,.06),0 10px 30px rgba(19,35,39,.12); --scrim:rgba(10,20,23,.44);
  --lb-bg:rgba(7,13,15,.94); --lb-ink:#E6EEED; --lb-ink-2:#A9BABB;
  --font-ui:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Newsreader","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1719; --surface:#122125; --surface-2:#1A2D32; --ink:#DCE7E6; --ink-2:#A2B4B6; --ink-3:#7F9396;
    --rule:#24373C; --rule-strong:#364D53;
    --accent:#6DBBB4; --accent-hover:#86CBC4; --accent-soft:#163A3C; --on-accent:#08201F; --halo:rgba(109,187,180,.28);
    --beacon:#E48BB8; --beacon-soft:#3B1D2D; --on-beacon:#2A0C1B;
    --star:#E3B553; --warn:#D9AE5C;
    --sea:#0E1E22; --land:#16272B; --land-line:#2D4449;
    --shadow-c:rgba(0,0,0,.5); --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1719; --surface:#122125; --surface-2:#1A2D32; --ink:#DCE7E6; --ink-2:#A2B4B6; --ink-3:#7F9396;
  --rule:#24373C; --rule-strong:#364D53;
  --accent:#6DBBB4; --accent-hover:#86CBC4; --accent-soft:#163A3C; --on-accent:#08201F; --halo:rgba(109,187,180,.28);
  --beacon:#E48BB8; --beacon-soft:#3B1D2D; --on-beacon:#2A0C1B;
  --star:#E3B553; --warn:#D9AE5C;
  --sea:#0E1E22; --land:#16272B; --land-line:#2D4449;
  --shadow-c:rgba(0,0,0,.5); --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%;background:var(--bg)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-ui);padding-left:var(--gl);padding-right:var(--gr)}
@media (min-width:1100px){:root{--gl:max(28px,env(safe-area-inset-left,0px));--gr:max(28px,env(safe-area-inset-right,0px))}}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.shell{height:100%;display:flex;flex-direction:column;min-height:0;max-width:1720px;margin:0 auto}

/* Masthead */
.masthead{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px;padding-block:18px 12px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand-mark{flex:none;color:var(--accent)}
.brand-mark .ring{stroke:var(--beacon)}
.brand h1{margin:0;font:500 30px/1.05 var(--font-display);letter-spacing:-.012em;text-wrap:balance}
.tagline{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.stats{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.stat-new{display:inline-flex;align-items:baseline;gap:6px}
.beacon-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--beacon);align-self:center}
.head-actions{display:flex;gap:4px;align-items:center}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink);font:600 14px/1 var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--rule-strong);background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn svg{flex:none}
.btn .n{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.btn-primary .n{color:inherit}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink-2);cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--rule);border-radius:10px}
.seg button{height:34px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);font:600 13.5px/1 var(--font-ui);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink);background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg .n{margin-left:5px;font-weight:400;font-variant-numeric:tabular-nums;opacity:.85}
.tog{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink-2);font:600 13.5px/1 var(--font-ui);cursor:pointer;white-space:nowrap}
.tog:hover{color:var(--ink);border-color:var(--rule-strong)}
.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#hotBtn[aria-pressed="true"]{background:var(--beacon-soft);border-color:var(--beacon);color:var(--beacon)}
.hot-ring{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--beacon);flex:none}

.toolbar{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:4px 10px}
.search{position:relative;display:flex;align-items:center;flex:1 1 220px;min-width:0;max-width:420px}
.search svg{position:absolute;left:11px;color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:40px;padding:0 12px 0 36px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14.5px}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--halo)}
.sort{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2)}
.sort select{height:40px;padding:0 30px 0 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink);font:600 13.5px var(--font-ui);cursor:pointer}
#filtersBtn{margin-left:auto}
.map-fab{display:none}

.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-block:0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 12px;border:1px solid var(--rule-strong);border-radius:999px;background:var(--surface);color:var(--ink);font:600 13px/1 var(--font-ui);cursor:pointer;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip svg{flex:none;color:var(--ink-3)}
.chip:hover{border-color:var(--ink-3)}
.chip:hover svg{color:var(--ink)}
.chip-clear{height:30px;padding:0 6px;border:0;background:none;color:var(--accent);font:600 13px var(--font-ui);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.notice{display:flex;align-items:center;gap:10px;margin-block:0 10px;padding:8px 12px;border:1px dashed var(--rule-strong);border-radius:8px;font-size:13.5px;color:var(--ink-2)}

/* Stage */
.stage{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:clamp(380px,40vw,640px) minmax(0,1fr);gap:24px;padding-bottom:16px}
.pane{position:relative;min-width:0;min-height:0}
.list-pane{display:flex;flex-direction:column}
.scroller{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:6px;scrollbar-gutter:stable}
.map-pane{border:1px solid var(--rule);border-radius:14px;overflow:hidden;isolation:isolate;background:var(--sea)}
#map{position:absolute;inset:0;z-index:0}
.pane-switch{display:none}

.list-head{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:4px 0 9px;background:var(--bg);border-bottom:1px solid var(--rule-strong);font-size:13.5px;color:var(--ink-2)}
.list-head b{color:var(--ink);font-variant-numeric:tabular-nums}
.list-head .link-btn{font-size:13.5px}

/* Feed */
.feed-day{margin:0;padding:18px 0 6px 2px;font:600 13px/1.3 var(--font-ui);color:var(--ink-3)}
.feed-day:first-child{padding-top:12px}
.job{position:relative;padding:15px 52px 16px 12px;border-bottom:1px solid var(--rule);cursor:pointer;outline-offset:-2px}
.job:hover{background:var(--surface-2)}
.job.is-selected{background:var(--accent-soft)}
.job-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:10px;min-width:0;font-size:13.5px;color:var(--ink-2)}
.job-where{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;margin:0;min-width:0}
.job-hosp{position:relative;min-width:0;padding:0;border:0;background:none;color:var(--ink);font:600 13.5px/1.35 var(--font-ui);text-align:left;cursor:pointer;overflow-wrap:anywhere}
.job-hosp:hover{text-decoration:underline;text-underline-offset:3px}
.job-loc{white-space:nowrap}
.job-when{white-space:nowrap;color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
.job-title{margin:5px 0 8px;font:500 19.5px/1.25 var(--font-display);letter-spacing:-.003em;color:var(--ink);text-wrap:balance}
.job-badges{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.job-meta{margin-top:8px;margin-bottom:0;font-size:13.5px;color:var(--ink-2)}
.job-sum{margin:6px 0 0;font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.job.is-stale .job-title,.job.is-stale .job-hosp,.job.is-stale .job-sum,.job.is-stale .job-meta{color:var(--ink-3)}
.job.is-stale .badge-setting{background:transparent;border:1px solid var(--rule-strong);color:var(--ink-3)}
.job.is-stale .rel{color:var(--ink-3)}
.job.is-stale .rel .bars i.on{background:var(--ink-3)}
.sep{display:flex;flex-wrap:wrap;margin-left:-19px;clip-path:inset(-6px -6px -6px 19px)}
.sep > *{position:relative;margin-left:19px}
.sep > *::before{content:"";position:absolute;left:-10px;top:.32em;width:1px;height:.9em;background:var(--rule-strong)}

.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);font:700 12px/1 var(--font-ui);white-space:nowrap}
.badge-setting{background:var(--accent-soft);color:var(--accent)}
.badge-new{background:var(--beacon);color:var(--on-beacon)}
.badge-stale{background:transparent;border:1px dashed currentColor;color:var(--warn)}
.badge-closed{background:transparent;border:1px solid currentColor;color:var(--warn)}
.rel{display:inline-flex;align-items:center;gap:6px;font:700 12px/1 var(--font-ui);color:var(--ink-2);white-space:nowrap}
.rel .bars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.rel .bars i{display:block;width:3px;border-radius:1px;background:var(--rule-strong)}
.rel .bars i:nth-child(1){height:5px}.rel .bars i:nth-child(2){height:8.5px}.rel .bars i:nth-child(3){height:12px}
.rel .bars i.on{background:var(--accent)}
.rel.r3{color:var(--accent)}

.star{position:absolute;top:9px;right:6px;display:grid;place-items:center;width:40px;height:40px;padding:0;border:0;border-radius:8px;background:none;color:var(--ink-3);cursor:pointer}
.star:hover{color:var(--ink);background:var(--surface)}
.star[aria-pressed="true"]{color:var(--star)}
.star[aria-pressed="true"] path{fill:currentColor}

.sentinel{display:flex;justify-content:center;padding:18px 0 28px}
.empty{padding:36px 4px;max-width:46ch}
.empty h2{margin:0 0 8px;font:500 23px/1.2 var(--font-display)}
.empty p{margin:0 0 14px;color:var(--ink-2)}
.empty .fine{margin-top:14px}
.empty ul{margin:0 0 14px;padding-left:1.1em;color:var(--ink-3);font-size:13px;overflow-wrap:anywhere}
.loading{padding:30px 4px;color:var(--ink-2)}

/* Ledger */
.lg-group{padding-top:10px}
.lg-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;padding:12px 2px 8px;border-bottom:1.5px solid var(--ink)}
.lg-head h2{margin:0;font:500 22px/1.2 var(--font-display)}
.hot-tag{display:inline-flex;align-items:center;gap:6px;color:var(--beacon);font:700 12.5px/1 var(--font-ui)}
.lg-state{font-size:13px;color:var(--ink-3)}
.lg-count{margin-left:auto;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;padding:14px 8px 15px 4px;border-bottom:1px solid var(--rule);cursor:pointer;outline-offset:-2px}
.hrow:hover{background:var(--surface-2)}
.hrow.is-selected{background:var(--accent-soft)}
.hrow-name{margin:0;font:500 18.5px/1.25 var(--font-display);text-wrap:balance}
.hrow-sub{margin-top:3px;margin-bottom:9px;font-size:13.5px;color:var(--ink-2)}
.caps{display:flex;flex-wrap:wrap;gap:5px}
.cap{display:inline-flex;align-items:center;height:22px;padding:0 7px;border:1px solid var(--rule-strong);border-radius:5px;color:var(--ink);font:600 12px/1 var(--font-ui);white-space:nowrap}
.cap.is-magnet{border-color:var(--accent);color:var(--accent)}
.hrow-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;text-align:right}
.hrow-count{font-size:13px;color:var(--ink-3);white-space:nowrap}
.hrow-count b{display:block;font:700 22px/1 var(--font-ui);font-variant-numeric:tabular-nums}
.hrow-count.has{color:var(--ink-2)}
.hrow-count.has b{color:var(--accent)}
.ext-link{display:inline-flex;align-items:center;gap:5px;font:600 13px/1.2 var(--font-ui);color:var(--accent);text-decoration:none;white-space:nowrap}
.ext-link:hover{text-decoration:underline;text-underline-offset:3px}

/* Detail panel */
.panel{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;visibility:visible;background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:panel-in .18s ease-out}
@keyframes panel-in{from{opacity:0;transform:translateY(8px)}}
.panel-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--surface)}
.panel-bar .grow{flex:1}
.panel-bar .btn{height:36px;padding:0 10px;border-color:transparent;background:transparent;color:var(--ink-2)}
.panel-bar .btn:hover{background:var(--surface-2);color:var(--ink)}
.panel-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 26px 40px}
.panel-body > *{max-width:68ch}
.panel-body > .gal,.panel-body > .facts,.panel-body > .wiki,.panel-body > .no-photo{max-width:none}
.eyebrow-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-size:14px;color:var(--ink-2)}
.link-btn{padding:0;border:0;background:none;color:var(--accent);font:600 14px/1.35 var(--font-ui);text-align:left;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.d-title{margin:8px 0 12px;font:500 30px/1.12 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.d-title:focus{outline:none}
.d-badges{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.d-actions{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 8px}
.btn-lg{height:46px;padding:0 20px;font-size:15px}
.copy-fallback{display:flex;gap:8px;margin:6px 0 0}
.copy-fallback input{flex:1;min-width:0;height:36px;padding:0 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface-2);color:var(--ink);font-size:13px}
.d-lede{margin:18px 0 6px;font-size:16.5px;line-height:1.55}
.d-why{margin:0;font-size:13.5px;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 22px;margin:22px 0 4px;padding:16px 0;border-block:1px solid var(--rule)}
.facts div{min-width:0}
.facts dt{margin:0 0 2px;font-size:12.5px;color:var(--ink-3)}
.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.facts dd.unknown{font-weight:400;color:var(--ink-3)}
.sec{margin-top:28px}
.sec h3{margin:0 0 10px;font:700 15px/1.3 var(--font-ui)}
.desc{font:400 17px/1.62 var(--font-display);color:var(--ink);overflow-wrap:break-word}
.desc p{margin:0 0 .85em}
.bullets{margin:0;padding-left:1.15em}
.bullets li{margin:0 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:13px;white-space:nowrap}
.fine{font-size:12.5px;color:var(--ink-3)}
.fine a{color:inherit}
.mini{border-top:1px solid var(--rule)}
.mini-job{display:block;width:100%;padding:12px 4px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;cursor:pointer;color:var(--ink)}
.mini-job:hover{background:var(--surface-2)}
.mini-job .t{display:block;margin:0 0 6px;font:500 17px/1.25 var(--font-display)}
.mini-job.is-stale .t{color:var(--ink-3)}

/* Hospital detail */
.gal{margin:-20px -26px 18px}
.gal-main{position:relative;margin:0}
.gal-open{display:block;width:100%;aspect-ratio:16/9;max-width:100%;padding:0;border:0;background:var(--surface-2);cursor:zoom-in;overflow:hidden}
.gal-open img{display:block;width:100%;height:100%;object-fit:cover}
.gal-fail{display:none;position:absolute;inset:0;place-items:center;padding:20px;text-align:center;color:var(--ink-3);font-size:13.5px}
.is-broken img{visibility:hidden}
.is-broken .gal-fail{display:grid}
.gal-main.is-broken .gal-open{aspect-ratio:auto;height:84px;cursor:default}
.gal-thumbs button.is-broken{display:none}
.gal-cap{margin:0;padding:8px 26px 0;font-size:13px;color:var(--ink-2)}
.gal-credit{display:block;font-size:12px;color:var(--ink-3)}
.gal-credit a{color:inherit}
.gal-thumbs{display:flex;gap:6px;padding:10px 26px 0;overflow-x:auto}
.gal-thumbs button{position:relative;flex:none;width:76px;height:50px;padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;background:var(--surface-2);cursor:pointer}
.gal-thumbs button[aria-current="true"]{border-color:var(--accent)}
.gal-thumbs img{display:block;width:100%;height:100%;object-fit:cover}
.wiki{margin:-20px -26px 18px}
.wiki .gal-cap{padding-top:10px}
.wiki-extract{margin:12px 26px 0;padding-left:12px;border-left:2px solid var(--rule-strong);font:italic 400 15.5px/1.55 var(--font-display);color:var(--ink-2)}
.no-photo{margin:-20px -26px 18px;padding:22px 26px;background:var(--surface-2);color:var(--ink-3);font-size:13.5px}
.h-parent{margin:2px 0 0;color:var(--ink-2);font-size:14.5px}
.h-addr{margin:6px 0 0;font-size:13.5px;color:var(--ink-3)}
.d-text{margin:0;font-size:15.5px;line-height:1.6}

/* Popovers and sheets */
.pop-sheet{position:absolute;z-index:40;top:calc(100% + 4px);right:0;display:flex;flex-direction:column;width:min(440px,calc(100vw - 32px));max-height:min(74vh,660px);background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.pop-head{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--rule)}
.pop-head h2{flex:1;margin:0;font:500 20px/1.2 var(--font-display)}
.pop-body{flex:1;min-height:0;overflow-y:auto;padding:6px 18px 16px}
.pop-foot{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-top:1px solid var(--rule)}
.pop-body p{margin:10px 0;font-size:14px;line-height:1.55}
.pop-body h3{margin:16px 0 4px;font:700 14px/1.3 var(--font-ui)}
.pop-body code{font-size:12.5px;padding:1px 4px;border-radius:4px;background:var(--surface-2)}
.pop-body dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0;font-size:13.5px}
.pop-body dt{color:var(--ink-3)}
.pop-body dd{margin:0}
fieldset{margin:0;padding:14px 0 6px;border:0;border-bottom:1px solid var(--rule);min-width:0}
fieldset:last-child{border-bottom:0}
legend{padding:0;margin-bottom:6px;font:700 14px/1.3 var(--font-ui)}
.fp-glabel{margin:10px 0 2px;font-size:12.5px;color:var(--ink-3)}
.check{display:flex;align-items:center;gap:10px;min-height:34px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
.check .ct{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pill-set{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative;display:inline-flex}
.pill input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pill span{display:inline-flex;align-items:center;height:32px;padding:0 12px;border:1px solid var(--rule);border-radius:999px;background:var(--surface);font:600 13px/1 var(--font-ui);color:var(--ink-2)}
.pill input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.scrim{position:fixed;inset:0;z-index:55;background:var(--scrim)}

/* Map */
.leaflet-container{background:var(--sea);font:inherit;color:var(--ink)}
.base-land{fill:var(--land);stroke:var(--land-line);stroke-width:1}
.z-hi .base-label{visibility:hidden}
.base-label{color:var(--ink-3);font:700 11px/1 var(--font-ui);letter-spacing:.08em;white-space:nowrap;text-align:center}
.leaflet-container .leaflet-control-attribution{background:var(--surface);color:var(--ink-3);font-size:11px}
.leaflet-container .leaflet-control-attribution a{color:var(--accent)}
.leaflet-bar,.leaflet-touch .leaflet-bar{border:1px solid var(--rule);box-shadow:none;border-radius:8px;overflow:hidden}
.leaflet-bar a,.leaflet-touch .leaflet-bar a{background:var(--surface);color:var(--ink);border-bottom-color:var(--rule)}
.leaflet-bar a:hover,.leaflet-bar a:focus{background:var(--surface-2);color:var(--ink)}
.leaflet-bar a.leaflet-disabled{background:var(--surface);color:var(--ink-3)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.leaflet-popup-content-wrapper{border-radius:10px}
.leaflet-popup-content{margin:14px 16px 14px;font:14px/1.45 var(--font-ui);min-width:200px}
.leaflet-container a.leaflet-popup-close-button{color:var(--ink-3);width:28px;height:28px;font-size:20px}
.leaflet-popup-content .pop-name{margin:0 18px 4px 0;font:500 18px/1.2 var(--font-display)}
.pop-sub{color:var(--ink-2);font-size:13px}
.pop-count{margin:8px 0 10px;font-weight:700}
.pop-count.none{font-weight:400;color:var(--ink-3)}
.pop-acts{display:flex;flex-wrap:wrap;gap:6px}
.pop-acts .btn{height:34px;padding:0 10px;font-size:13px}
.hm,.hc{display:grid;place-items:center;background:transparent;border:0}
.hm-dot,.hc-dot{position:relative;display:grid;place-items:center;width:100%;height:100%;flex:none;border-radius:50%;font:700 12px/1 var(--font-ui);font-variant-numeric:tabular-nums;transition:transform .15s ease-out,box-shadow .15s}
.hm-dot{background:var(--accent);color:var(--on-accent);border:2px solid var(--surface);box-shadow:0 1px 4px var(--shadow-c)}
.hm-dot.is-empty{background:var(--surface);border:2px solid var(--ink-3);box-shadow:none}
.hm-dot.is-at{background:var(--ink);color:var(--bg)}
.hm-dot.is-hot::after,.hc-dot.is-hot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--beacon);opacity:.85;pointer-events:none}
.hc-dot{background:var(--accent-soft);border:2px solid var(--accent);color:var(--accent);font-size:13px}
.hc-dot.is-empty{background:var(--surface);border:1.5px dashed var(--ink-3);color:var(--ink-3);font-size:11px}
.leaflet-marker-icon.is-lit{z-index:9000!important}
.is-lit .hm-dot,.is-lit .hc-dot{transform:scale(1.3);box-shadow:0 0 0 6px var(--halo)}
.map-legend{position:absolute;left:10px;bottom:10px;z-index:2;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;max-width:calc(100% - 20px);padding:7px 11px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;font-size:12px;color:var(--ink-2)}
.lg-i{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.lg-dot{position:relative;display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent);border:1.5px solid var(--surface)}
.lg-dot.is-empty{background:var(--surface);border-color:var(--ink-3)}
.lg-dot.is-hot{background:transparent;border-color:transparent}
.lg-dot.is-hot::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1.5px solid var(--beacon)}
.map-msg{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2);background:var(--sea)}
.map-msg p{max-width:36ch;margin:0}

/* Lightbox and toast */
.lightbox{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:56px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--lb-bg);color:var(--lb-ink)}
.lightbox img{max-width:100%;max-height:calc(100% - 90px);object-fit:contain;border-radius:4px}
.lb-cap{max-width:70ch;text-align:center;font-size:14px}
.lb-cap .gal-credit{color:var(--lb-ink-2);margin-top:4px}
.lb-btn{position:absolute;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--lb-ink);cursor:pointer}
.lb-btn:hover{background:rgba(255,255,255,.12)}
.lb-close{top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px))}
.lb-prev{left:max(8px,env(safe-area-inset-left,0px));top:50%}
.lb-next{right:max(8px,env(safe-area-inset-right,0px));top:50%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:95;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:10px 16px;border-radius:8px;background:var(--ink);color:var(--bg);font:600 14px/1.3 var(--font-ui);box-shadow:var(--shadow)}

@media (pointer:coarse){
  .btn,.tog,.search input,.sort select,.panel-bar .btn{height:44px}
  .icon-btn{width:44px;height:44px}
  .seg button{height:40px}
  .seg{padding:2px}
  .chip{position:relative;height:36px}
  .chip::after,.job-hosp::after,.ext-link::after,.link-btn::after{content:"";position:absolute;inset:-6px -2px}
  .chip-clear,.link-btn,.ext-link{position:relative;min-height:36px;display:inline-flex;align-items:center}
  .pill span{height:44px;padding:0 16px}
  .check{min-height:44px}
  .star{width:44px;height:44px;top:7px;right:4px}
  .leaflet-touch .leaflet-bar a{width:44px;height:44px;line-height:44px}
  .gal-thumbs button{width:88px;height:58px}
}

/* Medium widths: move secondary quick controls into the filter panel */
@media (max-width:1240px){ .q-wide{display:none!important} }
@media (max-width:1040px){ .stage{grid-template-columns:minmax(340px,1fr) minmax(0,1fr)} .tagline{display:none} }

/* Phones: one pane at a time, sheets from the bottom */
@media (max-width:860px){
  .masthead{gap:6px 12px;padding-block:12px 8px;align-items:center}
  .brand h1{font-size:25px}
  .brand-mark{width:22px;height:22px}
  .stats{order:3;width:100%;font-size:13px;gap:2px 14px}
  .toolbar{gap:8px}
  .view-seg{order:0}
  .search{order:2;flex:1 1 100%;max-width:none}
  #filtersBtn{order:1;margin-left:auto}
  #hotBtn{display:none}
  .stage{display:block;padding-bottom:0}
  .list-pane,.map-pane{position:absolute;top:0;bottom:0;left:0;right:0}
  .map-pane{left:calc(-1 * var(--gl));right:calc(-1 * var(--gr));border-radius:0;border-width:1px 0 0}
  body.pane-map .list-pane{visibility:hidden}
  body:not(.pane-map) .map-pane{visibility:hidden}
  .scroller{padding-right:0;padding-bottom:96px}
  .pane-switch{display:inline-flex;position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:45;transform:translateX(-50%);box-shadow:var(--shadow)}
  .pane-switch button{height:40px;padding:0 22px}
  body.pane-map .map-pane{position:fixed;inset:0;z-index:30;border:0}
  body.pane-map .leaflet-top{top:env(safe-area-inset-top,0px)}
  body.pane-map .leaflet-bottom{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  body.pane-map .leaflet-right{right:env(safe-area-inset-right,0px)}
  .map-legend{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;left:max(10px,env(safe-area-inset-left,0px));max-width:calc(100% - 140px);gap:4px 10px}
  .map-fab{display:inline-flex;position:absolute;z-index:4;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));box-shadow:var(--shadow)}
  .panel{position:fixed;inset:auto 0 0 0;height:min(90vh,calc(100% - 40px));height:min(90dvh,calc(100% - 40px));z-index:60;border-radius:16px 16px 0 0;border-width:1px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);animation:sheet-in .22s ease-out}
  .panel-bar{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .panel-body{padding:18px var(--gr) 40px var(--gl)}
  .gal,.wiki,.no-photo{margin:-18px calc(-1 * var(--gr)) 16px calc(-1 * var(--gl))}
  .gal-cap,.gal-thumbs{padding-left:var(--gl);padding-right:var(--gr)}
  .wiki-extract{margin-left:var(--gl);margin-right:var(--gr)}
  .d-title{font-size:26px}
  .pop-sheet{position:fixed;top:auto;left:0;right:0;bottom:0;width:auto;max-height:86vh;max-height:86dvh;z-index:60;border-radius:16px 16px 0 0;border-width:1px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .pop-head,.pop-foot{padding-left:var(--gl);padding-right:var(--gr)}
  .pop-body{padding-left:var(--gl);padding-right:var(--gr)}
  .hrow{grid-template-columns:minmax(0,1fr)}
  .hrow-side{flex-direction:row;align-items:center;justify-content:space-between;text-align:left}
  .hrow-count b{display:inline;font-size:16px;margin-right:4px}
  .job{padding-left:4px}
  .lg-count{margin-left:0;width:100%}
}
@keyframes sheet-in{from{transform:translateY(24px);opacity:.4}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

<body>
<div class="shell" id="shell">
  <header class="masthead">
    <div class="brand">
      <svg class="brand-mark" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="6" fill="currentColor"/><circle class="ring" cx="13" cy="13" r="10.5" fill="none" stroke-width="1.6"/></svg>
      <div>
        <h1>NP Job Finder</h1>
        <p class="tagline">Acute care pediatric NP openings at hospitals from South Carolina to Maine</p>
      </div>
    </div>
    <div class="stats" id="stats" aria-live="polite"><span>Loading the latest postings</span></div>
    <div class="head-actions">
      <button type="button" class="icon-btn" id="aboutBtn" aria-expanded="false" aria-controls="aboutPop" aria-label="About this board">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.9 7.6a2.2 2.2 0 1 1 3.3 1.9c-.7.4-1.2.9-1.2 1.7v.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="14.2" r=".95" fill="currentColor"/></svg>
      </button>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch to dark theme">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg>
      </button>
      <a class="icon-btn" id="repoLink" href="https://github.com/patspicksai/peds-np-job-board" target="_blank" rel="noopener noreferrer" aria-label="Open the GitHub repository">
        <svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
    <div class="pop-sheet" id="aboutPop" role="dialog" aria-labelledby="aboutTitle" hidden></div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="toolbar" id="toolbar">
    <div class="seg view-seg" role="group" aria-label="Choose a view">
      <button type="button" data-view="jobs" aria-pressed="true">Jobs<span class="n" id="nJobs"></span></button>
      <button type="button" data-view="hospitals" aria-pressed="false">Hospitals<span class="n" id="nHosp"></span></button>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.25" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search titles, hospitals, units, descriptions" aria-label="Search jobs and hospitals" autocomplete="off" spellcheck="false">
    </label>
    <button type="button" class="tog" id="hotBtn" aria-pressed="false"><span class="hot-ring" aria-hidden="true"></span>Hotspots only</button>
    <div class="seg q-wide" id="relSeg" role="group" aria-label="Relevance">
      <button type="button" data-rel="3" aria-pressed="false">Strong only</button>
      <button type="button" data-rel="2" aria-pressed="false">Strong + likely</button>
      <button type="button" data-rel="1" aria-pressed="true">All</button>
    </div>
    <button type="button" class="tog q-wide" id="starBtn" aria-pressed="false">
      <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L10 14.6l-4.8 2.5.9-5.4-3.9-3.8 5.4-.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Starred
    </button>
    <label class="sort q-wide" for="sortSel">Sort
      <select id="sortSel">
        <option value="new">Newest first</option>
        <option value="hospital">By hospital</option>
        <option value="rel">By relevance</option>
      </select>
    </label>
    <button type="button" class="btn" id="filtersBtn" aria-expanded="false" aria-controls="filterPop">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M4.5 8h7M7 12h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Filters<span class="n" id="nFilters"></span>
    </button>
    <div class="pop-sheet" id="filterPop" role="dialog" aria-labelledby="filterTitle" hidden></div>
  </div>

  <div class="chips" id="chips" aria-label="Active filters" hidden></div>

  <main class="stage" id="stage">
    <section class="pane list-pane" id="listPane" aria-label="Jobs and hospitals">
      <div class="scroller" id="scroller">
        <div class="list-head" id="listHead" aria-live="polite"></div>
        <div class="feed" id="feed" aria-label="Job postings"></div>
        <div class="ledger" id="ledger" aria-label="Hospital ledger" hidden></div>
        <div class="sentinel" id="sentinel" hidden><button type="button" class="btn" id="moreBtn">Show more jobs</button></div>
        <div class="empty" id="empty" hidden></div>
        <div class="loading" id="loading">Loading the latest postings&hellip;</div>
      </div>
      <aside class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="panelTitle" hidden></aside>
    </section>
    <section class="pane map-pane" id="mapPane" aria-label="Map of hospitals">
      <div id="map"></div>
      <div class="map-legend" aria-hidden="true">
        <span class="lg-i"><i class="lg-dot"></i>Open jobs</span>
        <span class="lg-i"><i class="lg-dot is-empty"></i>No matching jobs</span>
        <span class="lg-i"><i class="lg-dot is-hot"></i>Hotspot region</span>
      </div>
      <button type="button" class="btn map-fab" id="mapFiltersBtn" aria-controls="filterPop">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M4.5 8h7M7 12h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Filters<span class="n" id="nFilters2"></span>
      </button>
      <div class="map-msg" id="mapMsg" hidden></div>
    </section>
  </main>

  <div class="seg pane-switch" id="paneSwitch" role="group" aria-label="Show the list or the map">
    <button type="button" data-pane="list" aria-pressed="true">List</button>
    <button type="button" data-pane="map" aria-pressed="false">Map</button>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

/* ---------- URL hash state ---------- */
function dec(v){ try { return decodeURIComponent(String(v).replace(/\+/g, ' ')); } catch(e){ return v; } }
function readHash(){
  var s = clone(DEFAULTS), h = '';
  try { h = (location.hash || '').replace(/^#/, ''); } catch(e){}
  if(!h) return s;
  if(h.indexOf('=') < 0){
    var m;
    if(h === 'hospitals') s.view = 'hospitals';
    else if((m = /^job-([A-Za-z0-9._~-]+)$/.exec(h))) s.job = m[1];
    else if((m = /^hospital-([A-Za-z0-9._~-]+)$/.exec(h))) s.hosp = m[1];
    return s;
  }
  h.split('&').forEach(function(kv){
    var i = kv.indexOf('='); if(i < 0) return;
    var k = kv.slice(0, i), v = kv.slice(i + 1);
    var list = function(){ return v ? v.split(',').map(dec).map(function(x){ return x.trim(); }).filter(Boolean) : []; };
    if(k === 'view') s.view = v === 'hospitals' ? 'hospitals' : 'jobs';
    else if(k === 'region') s.region = list();
    else if(k === 'state') s.state = list().map(function(x){ return x.toUpperCase(); });
    else if(k === 'type') s.type = list();
    else if(k === 'setting') s.setting = list();
    else if(k === 'rel'){ var r = parseInt(v, 10); s.rel = (r === 2 || r === 3) ? r : 1; }
    else if(k === 'age'){ var a = parseInt(v, 10); s.age = [1, 7, 30].indexOf(a) > -1 ? a : 0; }
    else if(k === 'q') s.q = dec(v);
    else if(k === 'hot') s.hot = v === '1';
    else if(k === 'star') s.star = v === '1';
    else if(k === 'stale') s.stale = v !== '0';
    else if(k === 'sort') s.sort = SORT[v] ? v : 'new';
    else if(k === 'at') s.at = dec(v);
    else if(k === 'job') s.job = dec(v);
    else if(k === 'hosp') s.hosp = dec(v);
  });
  return s;
}
function buildHash(){
  var p = ['view=' + S.view];
  var L = function(k, a){ if(a.length) p.push(k + '=' + a.map(encodeURIComponent).join(',')); };
  L('region', S.region); if(S.hot) p.push('hot=1'); L('state', S.state); L('type', S.type); L('setting', S.setting);
  if(S.rel > 1) p.push('rel=' + S.rel); if(S.age) p.push('age=' + S.age);
  if(S.q) p.push('q=' + encodeURIComponent(S.q)); if(S.star) p.push('star=1'); if(!S.stale) p.push('stale=0');
  if(S.sort !== 'new') p.push('sort=' + S.sort); if(S.at) p.push('at=' + encodeURIComponent(S.at));
  if(S.job) p.push('job=' + encodeURIComponent(S.job)); else if(S.hosp) p.push('hosp=' + encodeURIComponent(S.hosp));
  return p.length === 1 && S.view === 'jobs' ? '' : p.join('&');
}
function filterKey(s){ var c = clone(s); delete c.job; delete c.hosp; return JSON.stringify(c); }
function writeHash(push){
  var h = buildHash(), cur = (location.hash || '').replace(/^#/, '');
  if(h === cur) return;
  try { history[push ? 'pushState' : 'replaceState'](null, '', location.pathname + location.search + (h ? '#' + h : '')); }
  catch(e){ try { suppressHash = true; location.hash = h; } catch(e2){} }
}
function onHashNav(){
  if(suppressHash){ suppressHash = false; return; }
  if(!D.loaded) return;
  var before = filterKey(S);
  S = readHash();
  $('q').value = S.q;
  if(filterKey(S) !== before) update({noHash:true});
  var top = panelTop();
  if(S.job){ if(!top || top.type !== 'job' || top.id !== S.job) showPanel({type:'job', id:S.job}, {replace:true, noHash:true}); }
  else if(S.hosp){ if(!top || top.type !== 'hosp' || top.id !== S.hosp) showPanel({type:'hosp', id:S.hosp}, {replace:true, noHash:true}); }
  else if(panelStack.length) closePanel({noHash:true});
}

/* ---------- data loading ---------- */
function fetchJSON(url){
  var u = url + (url.indexOf('?') > -1 ? '&' : '?') + 'v=' + Date.now();
  return fetch(u, {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}
function dataBases(){
  var list = [], o = null;
  try { o = new URLSearchParams(location.search).get('data'); } catch(e){}
  if(o) list.push(o.replace(/\/?$/, '/'));
  list.push('./data/');
  if(list.indexOf(RAW_BASE) < 0) list.push(RAW_BASE);
  return list;
}
function loadData(){
  var bases = dataBases(), attempts = [];
  return new Promise(function(resolve, reject){
    (function next(i){
      if(i >= bases.length){ var err = new Error('no data'); err.attempts = attempts; reject(err); return; }
      var b = bases[i];
      Promise.all([fetchJSON(b + 'hospitals.json'), fetchJSON(b + 'jobs.json')]).then(function(d){
        if(!d[0] || !Array.isArray(d[0].hospitals) || !d[1] || !Array.isArray(d[1].jobs)) throw new Error('unexpected file shape');
        resolve({base:b, hospDoc:d[0], jobsDoc:d[1]});
      }).catch(function(e){ attempts.push(b + ' (' + (e && e.message ? e.message : 'failed') + ')'); next(i + 1); });
    })(0);
  });
}
function ingest(r){
  D.base = r.base; D.hospDoc = r.hospDoc; D.jobsDoc = r.jobsDoc;
  D.fixture = !!(r.hospDoc._fixture || r.jobsDoc._fixture);
  D.hospitals = []; D.H = {};
  r.hospDoc.hospitals.forEach(function(h){
    if(!h || !h.slug || h.active === false) return;
    h.name = str(h.name) || h.slug;
    h.lat = typeof h.lat === 'string' ? parseFloat(h.lat) : h.lat;
    h.lng = typeof h.lng === 'string' ? parseFloat(h.lng) : h.lng;
    h.state = str(h.state).toUpperCase();
    h.region = str(h.region) || 'Unassigned';
    h.hotspot = h.hotspot === true || (h.hotspot == null && !!(REGION_INFO[h.region] && REGION_INFO[h.region].hot));
    ['peds_services', 'highlights', 'photos', 'sources'].forEach(function(k){ h[k] = arr(h[k]); });
    h._jobs = [];
    h._search = [h.name, h.parent_hospital, h.health_system, h.city, h.state, h.region].map(str).join(' ').toLowerCase();
    D.H[h.slug] = h; D.hospitals.push(h);
  });
  D.jobs = []; D.J = {};
  var gen = parseTs(r.jobsDoc.generated_at), inactive = {};
  r.hospDoc.hospitals.forEach(function(h){ if(h && h.slug && h.active === false) inactive[h.slug] = 1; });
  r.jobsDoc.jobs.forEach(function(j, i){
    if(!j) return;
    j.id = str(j.id) || ('job-' + i);
    j.title = str(j.title) || 'Untitled posting';
    j.status = j.status || 'active';
    j.relevance = parseInt(j.relevance, 10); if(!(j.relevance >= 1 && j.relevance <= 3)) j.relevance = 1;
    j.setting = SETTING[j.setting] ? j.setting : 'unspecified';
    j.tags = arr(j.tags); j.requirements = arr(j.requirements);
    j._h = D.H[j.hospital_slug] || null;
    if(!j._h && inactive[j.hospital_slug]) return;
    j._first = parseTs(j.first_seen_at); if(!isNum(j._first)) j._first = parseTs(j.last_seen_at); if(!isNum(j._first)) j._first = isNum(gen) ? gen : 0;
    j._last = parseTs(j.last_seen_at);
    j._posted = parseDay(j.posted_at);
    j._search = [j.title, j._h ? j._h.name : j.hospital_slug, j._h ? j._h.parent_hospital : '', j.department, j.description, j.summary, j.location_text, j.city].map(str).join(' ').toLowerCase();
    D.J[j.id] = j;
    if(j.status === 'closed') return;
    D.jobs.push(j);
    if(j._h) j._h._jobs.push(j);
  });
  D.hospitals.forEach(function(h){ h._jobs.sort(cmpNew); });
  D.loaded = true;
}
function hospName(j){ return j._h ? j._h.name : (j.hospital_slug || 'Unknown hospital'); }
function jobLoc(j){
  var c = j._h ? j._h.city : j.city, s = j._h ? j._h.state : j.state;
  return [c, s].filter(Boolean).join(', ');
}

/* ---------- filtering ---------- */
function qTokens(){ return S.q.toLowerCase().split(/\s+/).map(function(t){ return t.replace(/^["']+|["']+$/g, ''); }).filter(Boolean); }
function hospPasses(h){
  if(S.region.length && S.region.indexOf(h.region) < 0) return false;
  if(S.hot && !h.hotspot) return false;
  if(S.state.length && S.state.indexOf(h.state) < 0) return false;
  if(S.type.length && S.type.indexOf(h.hospital_type) < 0) return false;
  return true;
}
function jobPasses(j, now, toks){
  var h = j._h;
  if(h){ if(!hospPasses(h)) return false; }
  else {
    if(S.region.length || S.hot || S.type.length) return false;
    if(S.state.length && S.state.indexOf(str(j.state).toUpperCase()) < 0) return false;
  }
  if(S.setting.length && S.setting.indexOf(j.setting) < 0) return false;
  if(j.relevance < S.rel) return false;
  if(S.age && now - j._first > S.age * DAY) return false;
  if(!S.stale && j.status === 'stale') return false;
  if(S.star && !stars.has(j.id)) return false;
  for(var i = 0; i < toks.length; i++){ if(j._search.indexOf(toks[i]) < 0) return false; }
  return true;
}
function cmpNew(a, b){ return (b._first - a._first) || ((b._posted || 0) - (a._posted || 0)) || (b.relevance - a.relevance) || a.title.localeCompare(b.title); }
function sorter(){
  if(S.sort === 'hospital') return function(a, b){ return hospName(a).localeCompare(hospName(b)) || cmpNew(a, b); };
  if(S.sort === 'rel') return function(a, b){ return (b.relevance - a.relevance) || cmpNew(a, b); };
  return cmpNew;
}
function jobFiltersActive(){ return !!(S.setting.length || S.rel > 1 || S.age || S.q || S.star || !S.stale); }
function computeFiltered(){
  var now = Date.now(), toks = qTokens(), all = [], counts = {};
  D.jobs.forEach(function(j){
    if(!jobPasses(j, now, toks)) return;
    all.push(j);
    counts[j.hospital_slug] = (counts[j.hospital_slug] || 0) + 1;
  });
  var jobs = S.at ? all.filter(function(j){ return j.hospital_slug === S.at; }) : all;
  jobs.sort(sorter());
  var hospitals = D.hospitals.filter(function(h){
    if(!hospPasses(h)) return false;
    var n = counts[h.slug] || 0;
    if(S.star && !n) return false;
    if(toks.length && !n && !toks.every(function(t){ return h._search.indexOf(t) > -1; })) return false;
    return true;
  });
  F = {jobs: jobs, hospitals: hospitals, countBySlug: counts, now: now};
}
function activeFilterCount(){
  return S.region.length + (S.hot ? 1 : 0) + S.state.length + S.type.length + S.setting.length + (S.rel > 1 ? 1 : 0) + (S.age ? 1 : 0) + (S.star ? 1 : 0) + (S.stale ? 0 : 1);
}

/* ---------- feed ---------- */
function bucketOf(j){
  var d = F.now - j._first;
  if(d <= NEW_MS) return 'New in the last 48 hours';
  if(d <= 7 * DAY) return 'Earlier this week';
  if(d <= 30 * DAY) return 'Earlier this month';

}
function relHTML(j){

    $('empty').innerHTML = emptyHTML('jobs'); $('empty').hidden = false; $('sentinel').hidden = true;
    return;
  }

function appendChunk(){
  var end = Math.min(F.jobs.length, feedRendered + CHUNK), html = '';
  for(var i = feedRendered; i < end; i++){
    var j = F.jobs[i];
    if(S.sort === 'new'){

      if(b !== lastBucket){ html += '<h2 class="feed-day">' + esc(b) + '</h2>'; lastBucket = b; }
    }
    html += cardHTML(j);
  }
  var feed = $('feed');
  feed.insertAdjacentHTML('beforeend', html);
  var cards = feed.querySelectorAll('.job');
  if(cardIO){ for(var c = feedRendered; c < cards.length; c++) cardIO.observe(cards[c]); }
  feedRendered = end;

function setupObservers(){
  if(!('IntersectionObserver' in window)) return;
  var root = $('scroller');

    entries.forEach(function(e){ if(!e.target) return; if(e.isIntersecting) visibleCards.add(e.target); else visibleCards.delete(e.target); });
    var best = null, top = Infinity;
    visibleCards.forEach(function(el){ if(!el || !el.isConnected) return; var t = el.getBoundingClientRect().top; if(t < top){ top = t; best = el; } });
    if(best){ scrollSlug = best.getAttribute('data-slug') || ''; relight(); }
  }, {root: root, rootMargin: '-48px 0px -58% 0px', threshold: 0});
  sentinelIO = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting && S.view === 'jobs' && feedRendered < F.jobs.length) appendChunk(); });
  }, {root: root, rootMargin: '600px 0px'});
  sentinelIO.observe($('sentinel'));
}

  else if(act === 'lb-close'){ closeLightbox(); }
  else if(act === 'lb-prev'){ lbIndex = (lbIndex - 1 + lbItems.length) % lbItems.length; renderLightbox(); }
  else if(act === 'lb-next'){ lbIndex = (lbIndex + 1) % lbItems.length; renderLightbox(); }
  else if(act === 'see-list'){ setPane('list'); }
  else if(act === 'view-hospitals'){ S.view = 'hospitals'; update(); }
  else if(act === 'unstar-filter'){ S.star = false; update(); }
  else if(act === 'retry'){ boot(); }
}
function bind(){
  document.addEventListener('click', onAction, true);
  document.addEventListener('click', function(e){
    var chipEl = e.target.closest && e.target.closest('[data-chip]');
    if(chipEl){ removeChip(chipEl.getAttribute('data-chip'), chipEl.getAttribute('data-v')); return; }
    if(anyPopOpen()){
      var inPop = e.target.closest && e.target.closest('.pop-sheet, #filtersBtn, #mapFiltersBtn, #aboutBtn');
      if(!inPop) closePops();
    }
  });
  $('feed').addEventListener('click', function(e){
    if(e.target.closest('[data-act], a')) return;
    var card = e.target.closest('.job'); if(!card) return;
    openJob(card.getAttribute('data-job-id'), {trigger: card});
  });
  $('ledger').addEventListener('click', function(e){
    if(e.target.closest('[data-act], a')) return;
    var row = e.target.closest('.hrow'); if(!row) return;
    openHospital(row.getAttribute('data-slug'), {trigger: row});
  });
  ['feed', 'ledger'].forEach(function(id){
    var el = $(id);
    el.addEventListener('keydown', function(e){
      if(e.key !== 'Enter' && e.key !== ' ') return;
      var t = e.target;
      if(t.classList.contains('job')){ e.preventDefault(); openJob(t.getAttribute('data-job-id'), {trigger: t}); }
      else if(t.classList.contains('hrow')){ e.preventDefault(); openHospital(t.getAttribute('data-slug'), {trigger: t}); }
    });
    el.addEventListener('mouseover', function(e){ var c = e.target.closest('[data-slug].job, .hrow'); setHover(c ? c.getAttribute('data-slug') : ''); });
    el.addEventListener('mouseleave', function(){ setHover(''); });
    el.addEventListener('focusin', function(e){ var c = e.target.closest('.job, .hrow'); if(c) setHover(c.getAttribute('data-slug')); });
    el.addEventListener('focusout', function(){ setHover(''); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.view-seg [data-view]'), function(b){
    b.addEventListener('click', function(){ var v = b.getAttribute('data-view'); if(v === S.view) return; S.view = v; $('scroller').scrollTop = 0; update(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#relSeg [data-rel]'), function(b){
    b.addEventListener('click', function(){ S.rel = +b.getAttribute('data-rel'); update(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#paneSwitch [data-pane]'), function(b){
    b.addEventListener('click', function(){ setPane(b.getAttribute('data-pane')); });
  });
  $('hotBtn').addEventListener('click', function(){ S.hot = !S.hot; update(); });
  $('starBtn').addEventListener('click', function(){ S.star = !S.star; update(); });
  $('sortSel').addEventListener('change', function(){ S.sort = this.value; update(); });
  var qt = null;
  $('q').addEventListener('input', function(){
    var v = this.value;
    clearTimeout(qt);
    qt = setTimeout(function(){ if(v.trim() === S.q) return; S.q = v.trim(); if(D.loaded) update({keepMap: true}); }, 160);
  });
  $('q').addEventListener('keydown', function(e){ if(e.key === 'Escape' && this.value){ e.stopPropagation(); this.value = ''; S.q = ''; update({keepMap: true}); } });
  $('filtersBtn').addEventListener('click', function(){ if($('filterPop').hidden){ if(D.loaded) openPop('filterPop'); } else closePops(); });
  $('mapFiltersBtn').addEventListener('click', function(){ if($('filterPop').hidden){ if(D.loaded) openPop('filterPop'); } else closePops(); });
  $('aboutBtn').addEventListener('click', function(){ if($('aboutPop').hidden) openPop('aboutPop'); else closePops(); });
  $('filterPop').addEventListener('change', onFilterInput);
  $('themeBtn').addEventListener('click', toggleTheme);
  $('moreBtn').addEventListener('click', function(){ appendChunk(); });
  $('scrim').addEventListener('click', function(){ if(anyPopOpen()) closePops(); else closePanel(); });
  document.addEventListener('keydown', function(e){
    if(!$('lightbox').hidden){
      if(e.key === 'Escape'){ e.preventDefault(); closeLightbox(); }
      else if(e.key === 'ArrowLeft' && lbItems.length > 1){ lbIndex = (lbIndex - 1 + lbItems.length) % lbItems.length; renderLightbox(); }
      else if(e.key === 'ArrowRight' && lbItems.length > 1){ lbIndex = (lbIndex + 1) % lbItems.length; renderLightbox(); }
      return;
    }
    if(e.key !== 'Escape') return;
    if(anyPopOpen()){ e.preventDefault(); closePops(); return; }
    if(!$('panel').hidden){ e.preventDefault(); closePanel(); return; }
    if(MAP && popupSlug){ MAP.closePopup(); }
  });
  document.addEventListener('error', function(e){
    var t = e.target;
    if(t && t.tagName === 'IMG'){ var f = t.closest('.gal-main, .gal-thumbs button'); if(f) f.classList.add('is-broken'); }
  }, true);
  window.addEventListener('hashchange', onHashNav);
  window.addEventListener('popstate', onHashNav);
  try {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function(){ syncThemeBtn(); setTiles(); };
    if(mq.addEventListener) mq.addEventListener('change', onScheme); else if(mq.addListener) mq.addListener(onScheme);
  } catch(e){}
  try { new MutationObserver(function(){ syncThemeBtn(); setTiles(); }).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']}); } catch(e){}
  setInterval(function(){ if(D.loaded) renderStats(); }, 60000);
}

/* ---------- boot ---------- */
function showLoadError(err){
  $('loading').hidden = true; $('feed').hidden = true; $('ledger').hidden = true; $('sentinel').hidden = true;
  $('listHead').innerHTML = '';
  $('stats').innerHTML = '<span>Job data unavailable</span>';
  var tried = (err && err.attempts) || [];
  $('empty').innerHTML = '<h2>The job data did not load</h2><p>The page could not read <code>hospitals.json</code> and <code>jobs.json</code> from any of its sources. Check the connection, then try again. On GitHub Pages the files live in the <code>data</code> folder next to this page.</p>' +
    (tried.length ? '<ul>' + tried.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '') +
    '<button type="button" class="btn btn-primary" data-act="retry">Try again</button>';
  $('empty').hidden = false;
  window.NPJobs.error = err;
}
function boot(){
  $('empty').hidden = true; $('loading').hidden = false;
  loadData().then(function(r){
    ingest(r);
    renderStats();
    if(D.fixture){
      var n = $('notice');
      n.innerHTML = '<span>Sample data for previewing the board. Real postings replace it after the first daily scrape.</span>';
      n.hidden = false;
    } else $('notice').hidden = true;
    if(!MAP) initMap();
    update({initial: true, noHash: true});
    if(S.job) openJob(S.job, {noHash: true, replace: true, scrollCard: true});
    else if(S.hosp) openHospital(S.hosp, {noHash: true, replace: true});
    writeHash(false);
    window.NPJobs.ready = true;
    try { document.dispatchEvent(new CustomEvent('npjobs:ready')); } catch(e){}
  }).catch(function(err){
    if(err && err.attempts) showLoadError(err);
    else { console.error(err); showLoadError({attempts: ['Page error: ' + (err && err.message ? err.message : err)]}); }
  });
}

window.NPJobs = {ready: false, state: function(){ return S; }, filtered: function(){ return F; }, data: function(){ return D; }, update: update};
applyStoredTheme();
syncThemeBtn();
loadStars();
bind();
setupObservers();
$('q').value = S.q;
boot();
})();
</script>
