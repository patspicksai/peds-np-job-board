name: enrich
on:
  workflow_dispatch:
    inputs:
      files:
        description: "Space-separated region/seed JSON paths to enrich"
        required: true
        default: "data/regions/northern_new_england.json"
      limit:
        description: "Max hospitals per file (0 = all)"
        required: false
        default: "0"
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Enrich
        run: |
          mkdir -p /tmp/enrich
          python3 scripts/enrich_hospitals.py ${{ github.event.inputs.files }} --out-dir /tmp/enrich --limit ${{ github.event.inputs.limit }} 2>&1 | tee /tmp/enrich/run.log
      - name: Publish to ci-logs
        if: always()
        run: bash scraper/tools/ci_publish.sh /tmp/enrich "enrich/${{ github.run_id }}" "enrich ${{ github.run_id }}"
