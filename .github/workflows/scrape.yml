name: scrape
# Daily automated scrape: ledger -> data/runs/<date>.json -> data/jobs.json -> commit -> ntfy push.
# Two crons cover 06:15 America/New_York in both EDT (10:15 UTC) and EST (11:15 UTC); the guard step
# skips the second one when a scheduled scrape already committed today.
on:
  schedule:
    - cron: "15 10 * * *"
    - cron: "15 11 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated hospital slugs (optional)"
        default: ""
      limit:
        description: "max hospitals (0 = all)"
        default: "0"
      platform:
        description: "only this detected platform (optional)"
        default: ""
      ledger:
        description: "ledger path"
        default: "data/hospitals.json"
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
      SITE_URL: ${{ vars.SITE_URL || 'https://patspicksai.github.io/peds-np-job-board/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Skip if today's scheduled scrape already ran
        id: guard
        run: |
          TODAY=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && git log --since="$TODAY 00:00:00 +0000" --format=%s origin/main | grep -q "^scrape $TODAY"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Scrape for $TODAY already committed; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check ledger exists
        id: ledger
        if: steps.guard.outputs.skip != 'true'
        run: |
          L="${{ inputs.ledger || 'data/hospitals.json' }}"
          if [ -f "$L" ]; then echo "path=$L" >> "$GITHUB_OUTPUT"; else echo "::warning::ledger $L not found; nothing to scrape"; echo "path=" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true' && steps.ledger.outputs.path != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install
        if: steps.guard.outputs.skip != 'true' && steps.ledger.outputs.path != ''
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scrape
        id: scrape
        if: steps.guard.outputs.skip != 'true' && steps.ledger.outputs.path != ''
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/out"
          ARGS="--ledger ${{ steps.ledger.outputs.path }} --report-dir $RUNNER_TEMP/out"
          [ -n "${{ inputs.limit }}" ] && [ "${{ inputs.limit }}" != "0" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          [ -n "${{ inputs.only }}" ] && ARGS="$ARGS --only ${{ inputs.only }}"
          [ -n "${{ inputs.platform }}" ] && ARGS="$ARGS --platform ${{ inputs.platform }}"
          timeout 44m python -m scraper.run $ARGS > "$RUNNER_TEMP/out/run.log" 2>&1
          echo "exit=$?" | tee -a "$RUNNER_TEMP/out/run.log"
          tail -c 200000 "$RUNNER_TEMP/out/run.log" > "$RUNNER_TEMP/out/run_tail.log"; rm -f "$RUNNER_TEMP/out/run.log"
          cat "$RUNNER_TEMP/out/status.txt" 2>/dev/null | head -400
      - name: Merge into data/jobs.json
        id: merge
        if: steps.guard.outputs.skip != 'true' && steps.ledger.outputs.path != ''
        run: |
          set +e
          python scripts/merge_jobs.py --stats-out "$RUNNER_TEMP/out/merge_stats.json" 2>&1 | tee "$RUNNER_TEMP/out/merge.txt"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          NEW=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/out/merge_stats.json')).get('new',0))" 2>/dev/null || echo 0)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit and push
        if: steps.guard.outputs.skip != 'true' && steps.ledger.outputs.path != ''
        run: |
          git config user.name "peds-np-scraper"; git config user.email "actions@users.noreply.github.com"
          git add data/runs
          [ "${{ steps.merge.outputs.rc }}" = "0" ] && git add data/jobs.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -qm "scrape $(date -u +%F): ${{ steps.merge.outputs.new }} new jobs"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Notify (ntfy)
        if: steps.guard.outputs.skip != 'true' && steps.ledger.outputs.path != '' && steps.merge.outputs.rc == '0'
        run: python -m scraper.notify --merge-stats "$RUNNER_TEMP/out/merge_stats.json" --ledger "${{ steps.ledger.outputs.path }}"
      - name: Publish run summary to ci-logs
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/out"; rm -f "$RUNNER_TEMP/out/run.json"
          bash scraper/tools/ci_publish.sh "$RUNNER_TEMP/out" "scrape/${{ github.run_id }}" "scrape ${{ github.run_id }}"
      - name: Fail on safety stop
        if: steps.merge.outputs.rc == '3' || steps.merge.outputs.rc == '4'
        run: |
          echo "::error::merge refused to write data/jobs.json (safety stop rc=${{ steps.merge.outputs.rc }}); run file kept in data/runs/"
          exit 1
