name: scrape
# Daily automated scrape: ledger -> data/runs/<date>.json -> data/jobs.json -> commit -> ntfy push.
# Schedule: GitHub starts cron runs late (observed 4 to 5 hours after the cron minute on 2026-10-20 and
# 2026-10-21), so the crons are set early, at 02:15 and 03:15 UTC (22:15 / 23:15 ET), which lands the finished
# board in the early morning Eastern even with that delay, and overnight if the delay disappears. The guard step
# skips the second run when a scrape already committed today ("scrape <date>: ..." on main), so normally exactly
# one scheduled run does work per day. Manual runs (workflow_dispatch) always run.
#
# Safety: scripts/merge_jobs.py never deletes jobs and refuses to write data/jobs.json (exit 3) if the active
# job count would drop below 50% of the previous count, or (exit 4) if the existing file does not parse.
# The run file is still committed in that case and the workflow fails so the problem is visible.
# Hard budget: the scrape step has a 100 minute timeout; the scraper's own soft budget (SCRAPER_BUDGET,
# default 90 min + grace) finishes earlier and always writes its run file. The ledger has ~500 hospitals
# on ~200 boards, so a full pass needs well over the original 40 minutes.
#
# Second pass: the `retry` job runs on a fresh runner (new IP, clean browser) and re-scrapes only the boards the
# first pass lost to bot walls, rate limits, timeouts or connection errors (scripts/combine_runs.py --select), then
# folds the results into the day's run file, jobs.json and coverage.json. Cloudflare-fronted systems that read fine
# in isolation came back 403 part-way through a long run on 2026-10-21, which is what this pass recovers.
on:
  schedule:
    - cron: "15 2 * * *"
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated hospital slugs (optional)"
        default: ""
      limit:
        description: "max hospitals (0 = all)"
        default: "0"
      platform:
        description: "only this detected platform (optional)"
        default: ""
      ledger:
        description: "ledger path"
        default: "data/hospitals.json"
      notify:
        description: "send the ntfy push (true/false)"
        default: "true"
      commit:
        description: "commit data/jobs.json + data/runs to main (false = test run; results only on ci-logs)"
        default: "true"
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    outputs:
      skipped: ${{ steps.guard.outputs.skip }}
      run_file: ${{ steps.scrape.outputs.run_file }}
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
      SITE_URL: ${{ vars.SITE_URL || 'https://patspicksai.github.io/peds-np-job-board/' }}
      SCRAPER_BUDGET: "5400"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip if today's scrape already ran
        id: guard
        run: |
          TODAY=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && git log origin/main --since="36 hours ago" --format=%s | grep -q "^scrape $TODAY:"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Scrape for $TODAY already committed; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check ledger exists
        id: ledger
        if: steps.guard.outputs.skip != 'true'
        run: |
          L="${{ inputs.ledger || 'data/hospitals.json' }}"
          if [ -f "$L" ] && python -c "import json,sys; d=json.load(open('$L')); sys.exit(0 if d.get('hospitals') else 1)"; then
            echo "path=$L" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ledger $L missing or empty; nothing to scrape"; echo "path=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true' && steps.ledger.outputs.path != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install
        if: steps.guard.outputs.skip != 'true' && steps.ledger.outputs.path != ''
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scrape
        id: scrape
        if: steps.guard.outputs.skip != 'true' && steps.ledger.outputs.path != ''
        timeout-minutes: 100
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/out"
          ARGS="--ledger ${{ steps.ledger.outputs.path }} --report-dir $RUNNER_TEMP/out"
          [ -n "${{ inputs.limit }}" ] && [ "${{ inputs.limit }}" != "0" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          [ -n "${{ inputs.only }}" ] && ARGS="$ARGS --only ${{ inputs.only }}"
          [ -n "${{ inputs.platform }}" ] && ARGS="$ARGS --platform ${{ inputs.platform }}"
          echo "args: $ARGS" > "$RUNNER_TEMP/out/args.txt"
          timeout --kill-after=30s 98m xvfb-run -a python -m scraper.run $ARGS > "$RUNNER_TEMP/out/run.log" 2>&1
          rc=$?
          echo "exit=$rc" | tee -a "$RUNNER_TEMP/out/run.log"
          tail -c 200000 "$RUNNER_TEMP/out/run.log" > "$RUNNER_TEMP/out/run_tail.log"; rm -f "$RUNNER_TEMP/out/run.log"
          cat "$RUNNER_TEMP/out/status.txt" 2>/dev/null | head -400
          RUNFILE=$(cat "$RUNNER_TEMP/out/run_path.txt" 2>/dev/null)
          echo "run_file=$RUNFILE" >> "$GITHUB_OUTPUT"
          [ -n "$RUNFILE" ] || echo "::error::scraper produced no run file (exit $rc)"
          exit 0
      - name: Merge into data/jobs.json
        id: merge
        if: steps.guard.outputs.skip != 'true' && steps.scrape.outputs.run_file != ''
        run: |
          set +e
          python scripts/merge_jobs.py "${{ steps.scrape.outputs.run_file }}" --compact --stats-out "$RUNNER_TEMP/out/merge_stats.json" 2>&1 | tee "$RUNNER_TEMP/out/merge.txt"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          NEW=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/out/merge_stats.json')).get('new',0))" 2>/dev/null || echo 0)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          python scripts/build_coverage.py "${{ steps.scrape.outputs.run_file }}" || echo "coverage build failed (non-fatal)"
          if [ "$rc" = "0" ]; then
            RF="${{ steps.scrape.outputs.run_file }}"
            python -m scraper.notify --merge-stats "$RUNNER_TEMP/out/merge_stats.json" --ledger "${{ steps.ledger.outputs.path }}" \
              --run "$RF" --digest "${RF%.json}.md" --no-send
          fi
          exit 0
      - name: Commit and push
        id: commit
        if: steps.guard.outputs.skip != 'true' && steps.scrape.outputs.run_file != '' && inputs.commit != 'false'
        run: |
          git config user.name "peds-np-scraper"; git config user.email "actions@users.noreply.github.com"
          git add data/runs
          [ -f data/coverage.json ] && git add data/coverage.json
          [ "${{ steps.merge.outputs.rc }}" = "0" ] && git add data/jobs.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          if [ "${{ steps.merge.outputs.rc }}" = "0" ]; then
            MSG="scrape $(date -u +%F): ${{ steps.merge.outputs.new }} new jobs"
          else
            MSG="scrape run $(date -u +%F): merge refused (rc=${{ steps.merge.outputs.rc }}), jobs.json unchanged"
          fi
          git commit -qm "$MSG"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then echo "pushed: $MSG"; exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::push failed after 5 attempts"; exit 1
      - name: Notify (ntfy)
        if: steps.guard.outputs.skip != 'true' && steps.merge.outputs.rc == '0' && inputs.notify != 'false'
        run: |
          RF="${{ steps.scrape.outputs.run_file }}"
          python -m scraper.notify --merge-stats "$RUNNER_TEMP/out/merge_stats.json" --ledger "${{ steps.ledger.outputs.path }}" --run "$RF"
      - name: Keep the run file for the retry pass
        if: always() && steps.guard.outputs.skip != 'true' && steps.scrape.outputs.run_file != ''
        run: |
          mkdir -p "$RUNNER_TEMP/base" && cp "${{ steps.scrape.outputs.run_file }}" "$RUNNER_TEMP/base/"
      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.skip != 'true' && steps.scrape.outputs.run_file != ''
        with:
          name: base-run-${{ github.run_id }}
          path: ${{ runner.temp }}/base/
          retention-days: 3
          if-no-files-found: ignore
      - name: Publish run summary to ci-logs
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/out"; rm -f "$RUNNER_TEMP/out/run.json"
          RF="${{ steps.scrape.outputs.run_file }}"
          [ -n "$RF" ] && [ -f "${RF%.json}.md" ] && cp "${RF%.json}.md" "$RUNNER_TEMP/out/digest.md"
          if [ "${{ inputs.commit }}" = "false" ] && [ -f data/jobs.json ]; then
            python -c "import json;d=json.load(open('data/jobs.json'));print(json.dumps({'last_run':d.get('last_run'),'jobs':len(d['jobs']),'sample':d['jobs'][:2]},indent=1))" > "$RUNNER_TEMP/out/jobs_preview.json"
          fi
          bash scraper/tools/ci_publish.sh "$RUNNER_TEMP/out" "scrape/${{ github.run_id }}" "scrape ${{ github.run_id }}"
      - name: Fail on safety stop or missing run file
        if: steps.guard.outputs.skip != 'true' && steps.ledger.outputs.path != '' && (steps.scrape.outputs.run_file == '' || steps.merge.outputs.rc == '3' || steps.merge.outputs.rc == '4')
        run: |
          echo "::error::scrape did not complete a merge (run_file='${{ steps.scrape.outputs.run_file }}' merge rc='${{ steps.merge.outputs.rc }}'); data/jobs.json left unchanged"
          exit 1

  retry:
    needs: scrape
    if: needs.scrape.outputs.skipped != 'true' && needs.scrape.outputs.run_file != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
      SITE_URL: ${{ vars.SITE_URL || 'https://patspicksai.github.io/peds-np-job-board/' }}
      SCRAPER_BUDGET: "1800"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: base-run-${{ github.run_id }}
          path: ${{ runner.temp }}/base/
      - name: Select the boards to retry
        id: sel
        run: |
          BASE=$(ls "$RUNNER_TEMP"/base/*.json | head -1)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          git show ${{ github.sha }}:data/coverage.json > "$RUNNER_TEMP/prev_coverage.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/prev_coverage.json"
          SLUGS=$(python3 scripts/combine_runs.py --select "$BASE" --prev-coverage "$RUNNER_TEMP/prev_coverage.json")
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          N=$(echo "$SLUGS" | tr ',' '\n' | grep -c . || true)
          echo "retrying $N boards: $SLUGS"
      - uses: actions/setup-python@v5
        if: steps.sel.outputs.slugs != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install
        if: steps.sel.outputs.slugs != ''
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Retry scrape (fresh runner)
        id: retry
        if: steps.sel.outputs.slugs != ''
        timeout-minutes: 40
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/out"
          timeout --kill-after=30s 38m xvfb-run -a python -m scraper.run --ledger data/hospitals.json --only "${{ steps.sel.outputs.slugs }}" \
            --out "$RUNNER_TEMP/retry.json" --report-dir "$RUNNER_TEMP/out" > "$RUNNER_TEMP/out/run.log" 2>&1
          echo "exit=$?" | tee -a "$RUNNER_TEMP/out/run.log"
          tail -c 200000 "$RUNNER_TEMP/out/run.log" > "$RUNNER_TEMP/out/run_tail.log"; rm -f "$RUNNER_TEMP/out/run.log"
          cat "$RUNNER_TEMP/out/status.txt" 2>/dev/null | head -200
          [ -f "$RUNNER_TEMP/retry.json" ] && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "::warning::retry produced no run file"
          exit 0
      - name: Fold the retry into the day's run, merge jobs, rebuild coverage
        id: fold
        if: steps.retry.outputs.ok == 'true'
        run: |
          set +e
          BASE="${{ steps.sel.outputs.base }}"
          TARGET="data/runs/$(basename "$BASE")"
          python scripts/combine_runs.py "$BASE" "$RUNNER_TEMP/retry.json" --out "$TARGET" | tee "$RUNNER_TEMP/out/combine.txt"
          git show ${{ github.sha }}:data/coverage.json > "$RUNNER_TEMP/prev_coverage.json" 2>/dev/null || cp data/coverage.json "$RUNNER_TEMP/prev_coverage.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/prev_coverage.json"
          python scripts/merge_jobs.py "$TARGET" --compact --stats-out "$RUNNER_TEMP/out/merge_stats.json" 2>&1 | tee "$RUNNER_TEMP/out/merge.txt"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          NEW=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/out/merge_stats.json')).get('new',0))" 2>/dev/null || echo 0)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          python scripts/build_coverage.py "$TARGET" --prev "$RUNNER_TEMP/prev_coverage.json" || echo "coverage build failed (non-fatal)"
          exit 0
      - name: Commit and push
        if: steps.fold.outputs.rc == '0' && inputs.commit != 'false'
        run: |
          git config user.name "peds-np-scraper"; git config user.email "actions@users.noreply.github.com"
          git add data/runs data/jobs.json
          [ -f data/coverage.json ] && git add data/coverage.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          TARGET="data/runs/$(basename "${{ steps.sel.outputs.base }}")"
          FIXED=$(python -c "import json;print(len(json.load(open('$TARGET')).get('retry',{}).get('fixed',[])))" 2>/dev/null || echo "?")
          MSG="scrape $(date -u +%F) retry: ${{ steps.fold.outputs.new }} more jobs, $FIXED boards recovered"
          git commit -qm "$MSG"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then echo "pushed: $MSG"; exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::push failed after 5 attempts"; exit 1
      - name: Notify (ntfy)
        if: steps.fold.outputs.rc == '0' && steps.fold.outputs.new != '0' && inputs.notify != 'false'
        run: |
          python -m scraper.notify --merge-stats "$RUNNER_TEMP/out/merge_stats.json" --ledger data/hospitals.json --run "$RUNNER_TEMP/retry.json"
      - name: Publish retry summary to ci-logs
        if: always() && steps.sel.outputs.slugs != ''
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          bash scraper/tools/ci_publish.sh "$RUNNER_TEMP/out" "scrape/${{ github.run_id }}/retry" "scrape ${{ github.run_id }} retry"
