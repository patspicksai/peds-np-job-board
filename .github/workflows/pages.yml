name: pages
# Deploys site/ (plus the live data files) to the gh-pages branch. GitHub serves that branch at
# https://patspicksai.github.io/peds-np-job-board/ (Pages was auto-enabled when the branch first appeared).
on:
  push:
    branches: [main]
    paths: ["site/**", "data/hospitals.json", "data/jobs.json", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [scrape]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          set -e
          rm -rf /tmp/site && mkdir -p /tmp/site/data
          cp -r site/. /tmp/site/
          rm -f /tmp/site/smoke_test.mjs
          # live data overrides the fixtures when it exists
          [ -f data/hospitals.json ] && cp data/hospitals.json /tmp/site/data/hospitals.json
          [ -f data/jobs.json ] && cp data/jobs.json /tmp/site/data/jobs.json
          [ -f data/coverage.json ] && cp data/coverage.json /tmp/site/data/coverage.json
          touch /tmp/site/.nojekyll
          echo "$(date -u +%FT%TZ) $GITHUB_SHA" > /tmp/site/build.txt
          ls -la /tmp/site /tmp/site/data
      - name: Push to gh-pages
        run: |
          set -e
          cd /tmp/site
          git init -q
          git checkout -q -b gh-pages
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "deploy $(date -u +%FT%TZ) from $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "deployed to https://patspicksai.github.io/peds-np-job-board/"
