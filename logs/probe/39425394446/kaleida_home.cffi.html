        <style>
            /* LMCLIENT-13005 - loading indicator displays for slow page loads  */
            @-webkit-keyframes landmarkFadeIn { 0% {opacity:0;} 30% {opacity:0;} 45% {opacity:1;} 100% {opacity:1;} }
            @-moz-keyframes landmarkFadeIn { 0% {opacity:0;} 30% {opacity:0;} 45% {opacity:1;} 100% {opacity:1;} }
            @keyframes landmarkFadeIn { 0% {opacity:0;} 30% {opacity:0;} 45% {opacity:1;} 100% {opacity:1;} }
            .landmarkLoading {
                height:100%;
                opacity:0;									/* start invisible */
                -webkit-animation:landmarkFadeIn ease-in 1;	/* slow start; repeat once */
                -moz-animation:landmarkFadeIn ease-in 1;
                animation:landmarkFadeIn ease-in 1;

                -webkit-animation-fill-mode:forwards;		/* remain at last keyframe value (opacity: 1) */
                -moz-animation-fill-mode:forwards;
                animation-fill-mode:forwards;

                -webkit-animation-duration:1s;
                -moz-animation-duration:1s;
                animation-duration:1s;

                -webkit-animation-delay:1ms;
                -moz-animation-delay:1ms;
                animation-delay:1ms;
            }
        </style>
        <div class="landmarkLoading busy">
