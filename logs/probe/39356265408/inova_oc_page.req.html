/* Awards slider */

.slider {
  padding-top: 50px;
  margin: 0 auto;
  overflow: hidden;
  position: relative;
  cursor: default;
  user-select: none;
  touch-action: none;
}

.slider:before {
  left: 0;
  top: 0;
}

.slider:after,
.slider:before {
  background: linear-gradient(to right, white 0%, hsla(0, 0%, 50%, 0) 100%);
  content: "";
  position: absolute;
  width: 450px;
  z-index: 2;
}

.slider:after {
  right: 0;
  top: 0;
  transform: rotateZ(180deg);
}

.slider:after,
.slider:before {
  background: linear-gradient(to right, white 0%, hsla(0, 0%, 100%, 0) 10%);
  content: "";
  height: 450pt;
  position: absolute;
  width: 550px;
  z-index: 2;
}

.slider .slide-track-1 {
  animation: scroll-l 50s linear infinite;
  display: flex;
  width: 7000px;
}

.slider .slide-track-2 {
  animation: scroll-r 50s linear infinite;
  display: flex;
  width: 6500px;
}

.slider .slide {
  height: 100%;
  width: 500px;
  display: flex;
  align-items: center;
  text-align: center;
}

.slider .slide img {
  min-width: 450px;
  padding: 10px;
  vertical-align: middle;
  margin: 0 auto;
  display: inline-block;
  max-width: 100%;
  height: 100%;
}

@keyframes scroll-l {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(calc(-270px * 19));
  }
}

@keyframes scroll-r {
  100% {
    transform: translateX(0);
  }
  0% {
    transform: translateX(calc(-250px * 15));
  }
}
