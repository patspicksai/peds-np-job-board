    height: 2rem;

    z-index: 2
}

    left: 0;
    top: 4.5rem;

}

    transition: opacity 1s ease-in-out;

    border-radius: 50%;
    box-shadow: 0 0 0 2px #005de9;
    outline: none
}

    transition: opacity .75s ease-in-out;
    transition: all .5s ease-in-out;
    opacity: 0
}

    transition: opacity .75s ease-in-out;
    opacity: 1;

    outline: none
}

    margin-right: 2px;

    z-index: 1;

    top: 15px
}

.nl-header .navigation__nav-container .slideout-menu {
    max-width: 100%;
    position: absolute;
    transition: all .5s ease-in-out;
    opacity: 1;
    width: 100vw;
    top: 4.5rem;
    left: -120vw;
    height: auto;
    background: #fff
}

.nl-header .navigation__nav-container .slideout-menu nav>ul {
    margin-top: 1.5rem;
    margin-left: 3rem
}

.nl-header .navigation__nav-container .slideout-menu nav>h2,.nl-header .navigation__nav-container .slideout-menu nav>h3 {
    background: #f2f4f7;
    padding-left: 3rem;
    padding: 1.25rem 0 1rem 1.6rem;

    font-weight: 400;
    color: #011d46 !important;
    text-transform: uppercase;
    border-bottom: 1px solid #011d46;
    margin-bottom: 1rem

.nl-header .navigation__nav-container .slideout-menu a {
    text-decoration: none;
    font-size: 16px
