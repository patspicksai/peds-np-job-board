  "forgotPasswordFlow": {
    "usernameCards": {
      "cards": [
        {
          "title": "Lost Password Recovery",
          "nav": {
            "prev": null,
            "submit": true
          },
          "fields": [
            {
              "type": "text",
              "name": "username",
              "id": "username",

              "data-parsley-required-message": "Username is Required",
              "data-parsley-minlength": "8",
              "data-parsley-maxlength": "100",
              "data-parsley-pattern": "/^[A-Za-z0-9!#$%&.\\\\\\'*+\\\\\\-\\\\\\/=?\\\\\\\\^_`{|}~_@\\\\\\']*$/",
              "data-parsley-pattern-message": "Your username may not contain spaces, and only the following special characters are allowed !#$%&\"*+-/=?^_`{|}~@\"."
            },
            {
              "type": "captcha",
              "name": "captcha",
              "id": "captcha",
              "label": "Captcha"
            }
          ]

      "Id": "1",
      "title": "Security Question",
      "nav": {
        "prev": null,
        "next": true
      },
      "fields": [
        {
          "type": "static",
          "name": "securityQuestion",
          "label": "Question:",
          "data": "Question failed to load."
        },
        {
          "type": "text",
          "name": "securityAnswer",
          "label": "Answer:",
          "data-parsley-required": "true",
          "data-parsley-required-message": "Please Answer Security Question",
          "data-parsley-maxlength": "100"
        }
      ]
    },
    "resetPassword": {
      "cards": [
        {
          "Id": "2",
          "title": "Reset Password",
          "nav": {
            "prev": null,
            "submit": true
          },
          "fields": [
            {
              "type": "passwordPolicy",
              "id": "passwordPolicy"
            },
            {
              "type": "password",
              "name": "password1",
              "id": "passwordMatch",
              "label": "Password: *",
              "data-parsley-required": "true",
              "data-parsley-required-message": "Password is Required",
              "data-parsley-minlength": "8",
              "data-parsley-pattern": "^(?=.*[0-9])(?=.*[A-Z])(?=.*[!@#$%^&*+=]).*$",
              "data-parsley-pattern-message": "Your password must contain at least 1 numeric and 1 uppercase and 1 special character"
            },
            {
              "type": "password",
              "name": "password2",
              "label": "Confirm Password: *",
              "data-parsley-required": "true",
              "data-parsley-required-message": "Please Confirm Password",
              "data-parsley-equalto": "#passwordMatch",
              "data-parsley-equalto-message": "The Passwords Don't Match"
            }
          ]
        }
      ]

          },

            {
              "type": "static",
              "name": "emailSent",

          ]

      ]
